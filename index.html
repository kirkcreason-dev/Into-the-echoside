<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0a14">
<title>Into the Echoside</title>
<style>
:root{
  --bg:#0d0a14; --bg2:#171226; --panel:#1e1733; --panel2:#2a2046;
  --ink:#efeaff; --dim:#9d92c2; --line:#3c2f66;
  --purple:#8b3dff; --green:#3aff8c; --red:#ff3d5e; --gold:#ffc63d;
  --dc:#c13dff; --psy:#ff3d5e; --ug:#3aa0ff; --item:#ffc63d; --fiend:#7dff3d; --epic:#ff8c3a; --flavor:#3affe0; --jug:#b0b0b0; --start:#8a8a8a;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px}
#app{height:100%;display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;overflow:hidden;padding-top:var(--safe-t)}
.screen.on{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;padding-bottom:calc(20px + var(--safe-b))}
h1,h2,h3{margin:.3em 0;font-family:Georgia,'Times New Roman',serif;letter-spacing:.5px}
.logo{font-family:Georgia,serif;text-align:center;margin:26px 0 4px;line-height:1.05}
.logo .l1{font-size:15px;letter-spacing:6px;color:var(--dim);text-transform:uppercase}
.logo .l2{font-size:40px;font-weight:800;background:linear-gradient(180deg,#d9b8ff,var(--purple) 55%,#42197a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 28px rgba(139,61,255,.45)}
.logo .l3{font-size:11px;color:var(--dim);letter-spacing:3px;text-transform:uppercase}
.tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:9px;border:1px solid var(--line);color:var(--dim);vertical-align:middle}
.tag.gold{color:var(--gold);border-color:var(--gold)}
.tag.recon{color:#ffb08a;border-color:#8a5a3c}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
.btn{display:block;width:100%;text-align:center;padding:15px;border-radius:14px;margin:9px 0;font-weight:700;font-size:16px;border:1px solid var(--line);background:var(--panel);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#6a24d8,#42197a);border-color:#9c5cff;box-shadow:0 4px 22px rgba(139,61,255,.35)}
.btn.green{background:linear-gradient(135deg,#0f8a46,#0a5e30);border-color:var(--green)}
.btn.small{width:auto;display:inline-block;padding:8px 14px;font-size:13px;margin:4px 4px 4px 0}
.btn.ghost{background:none}
.btn:disabled{opacity:.35}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg2)}
.topbar .back{font-size:22px;padding:2px 8px;color:var(--dim)}
.topbar h2{font-size:17px;margin:0;flex:1}
/* ---------- cards ---------- */
.card{position:relative;border-radius:10px;background:var(--panel);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
.card .art{position:relative;height:58%;min-height:44px;display:flex;align-items:center;justify-content:center;font-size:30px;background:radial-gradient(circle at 50% 30%,var(--c1) 0%,#12101d 90%)}
.card .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .cost{position:absolute;top:3px;left:3px;background:#000c;border:1px solid var(--gold);color:var(--gold);font-weight:800;font-size:12px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:2}
.card .gp{position:absolute;top:3px;right:3px;background:#000c;color:var(--green);font-weight:700;font-size:9px;padding:2px 4px;border-radius:6px;z-index:2}
.card .icons{position:absolute;bottom:2px;right:4px;font-size:11px;z-index:2;text-shadow:0 0 4px #000}
.card .nm{font-size:10px;font-weight:700;padding:3px 4px 0;line-height:1.15}
.card .ty{font-size:8px;color:var(--tc);padding:0 4px 3px;text-transform:uppercase;letter-spacing:.5px}
.card.sel{outline:2px solid var(--green);box-shadow:0 0 14px rgba(58,255,140,.5)}
.card.tilted{transform:rotate(6deg);opacity:.65}
.card.dis{opacity:.45}
.cardL{width:150px;height:210px}
.cardM{width:88px;height:124px;flex:0 0 88px}
.cardS{width:64px;height:92px;flex:0 0 64px}
.cardS .nm{font-size:8px}.cardS .ty{display:none}.cardS .art{font-size:22px}
.pile{width:64px;height:92px;border-radius:10px;border:1px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--dim);flex:0 0 64px;text-align:center;gap:2px}
.pile b{font-size:16px;color:var(--ink)}
.pile.facedown{background:repeating-linear-gradient(45deg,#221741,#221741 6px,#191031 6px,#191031 12px);border-style:solid}
/* ---------- board ---------- */
#gameScr{background:radial-gradient(ellipse at 50% -10%,#241a44 0%,var(--bg) 60%)}
.opRow{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--bg2);border-bottom:1px solid var(--line);font-size:12px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#42197a,#8b3dff);display:flex;align-items:center;justify-content:center;font-size:17px;border:2px solid var(--line)}
.avatar.active{border-color:var(--green);box-shadow:0 0 10px rgba(58,255,140,.6)}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 8px;white-space:nowrap}
.boardMid{flex:1;overflow-y:auto;padding:8px 10px}
.zoneLbl{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);margin:8px 0 4px}
.rowScroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.handWrap{border-top:1px solid var(--line);background:var(--bg2);padding:6px 10px calc(8px + var(--safe-b))}
.handBar{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px}
.karmaBig{font-size:17px;font-weight:800;color:var(--gold)}
.gpBig{font-weight:700;color:var(--green);font-size:13px}
#hand{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;min-height:128px}
#inPlayRow{min-height:0}
.endBtn{margin-left:auto;background:linear-gradient(135deg,#8a1030,#5e0a20);border:1px solid var(--red);padding:8px 14px;border-radius:10px;font-weight:800;font-size:13px}
.unityBtn{background:var(--panel);border:1px solid var(--purple);border-radius:10px;padding:8px 10px;font-size:12px;font-weight:700}
.unityBtn.ready{border-color:var(--green);color:var(--green);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(58,255,140,.0)}50%{box-shadow:0 0 12px rgba(58,255,140,.7)}}
/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:82vh;display:flex;flex-direction:column;padding:16px 16px calc(16px + var(--safe-b))}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet .sub{color:var(--dim);font-size:12px;margin-bottom:10px}
.sheet .body{overflow-y:auto;flex:1}
.optBtn{display:block;width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:12px;margin:6px 0;background:var(--panel2);font-size:14px}
.optBtn:active{background:#372a5e}
.cardGrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sheetBtns{display:flex;gap:8px;margin-top:12px}
.sheetBtns .btn{margin:0;flex:1;padding:12px}
/* ---------- big card view ---------- */
.bigWrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.bigTxt{font-size:13px;line-height:1.45;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%}
/* ---------- log ---------- */
#logDrawer{position:fixed;left:0;right:0;bottom:0;top:30%;background:var(--bg2);border-top:2px solid var(--purple);border-radius:18px 18px 0 0;z-index:40;display:none;flex-direction:column;padding:14px}
#logDrawer.on{display:flex}
#logBody{flex:1;overflow-y:auto;font-size:12px;line-height:1.6;color:var(--dim)}
#logBody b{color:var(--ink)}
/* ---------- toast / banner ---------- */
#toast{position:fixed;top:calc(12px + var(--safe-t));left:50%;transform:translateX(-50%);background:#000d;border:1px solid var(--purple);padding:10px 16px;border-radius:12px;font-size:13px;z-index:60;display:none;max-width:90%;text-align:center}
#turnBanner{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000a;z-index:55;font-family:Georgia,serif;font-size:30px;font-weight:800;letter-spacing:2px;text-shadow:0 0 30px var(--purple)}
/* ---------- wheel ---------- */
.wheel{width:150px;height:150px;border-radius:50%;border:4px solid var(--gold);margin:10px auto;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:900;color:var(--gold);background:conic-gradient(#2a2046 0 30deg,#1e1733 30deg 60deg,#2a2046 60deg 90deg,#1e1733 90deg 120deg,#2a2046 120deg 150deg,#1e1733 150deg 180deg,#2a2046 180deg 210deg,#1e1733 210deg 240deg,#2a2046 240deg 270deg,#1e1733 270deg 300deg,#2a2046 300deg 330deg,#1e1733 330deg 360deg);box-shadow:0 0 30px rgba(255,198,61,.35)}
.wheel.spin{animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- tutorial coach ---------- */
.coach{display:flex;gap:8px;align-items:flex-start;margin:8px 10px 0;background:linear-gradient(135deg,#2b2410,#1e1733);border:1px solid var(--gold);border-radius:14px;padding:10px 12px;font-size:12.5px;line-height:1.45;box-shadow:0 0 16px rgba(255,198,61,.25);position:relative;z-index:5}
.coach .cicon{font-size:20px}
.coach .ctxt{flex:1}
.coach .ctxt b{color:var(--gold)}
.coach .cnext{background:var(--gold);color:#241c00;font-weight:800;border-radius:10px;padding:8px 12px;font-size:12px;flex:0 0 auto}
.coach .cstep{position:absolute;top:-8px;right:10px;font-size:9px;background:#241c00;color:var(--gold);border:1px solid var(--gold);padding:1px 6px;border-radius:8px}
.tutHi{outline:2px solid var(--gold)!important;box-shadow:0 0 18px rgba(255,198,61,.55)!important;border-radius:12px;animation:pulse 1.2s infinite}
/* ---------- collection ---------- */
.filters{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 0}
.fbtn{padding:6px 12px;border-radius:20px;border:1px solid var(--line);font-size:12px;white-space:nowrap;color:var(--dim)}
.fbtn.on{border-color:var(--purple);color:var(--ink);background:var(--panel2)}
.colGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;padding:12px 14px calc(20px + var(--safe-b))}
.colGrid .card{width:100%;height:130px}
/* ---------- lobby & paywall ---------- */
.heroCard{background:linear-gradient(135deg,#2b1a55,#160f2c);border:1px solid var(--purple);border-radius:18px;padding:18px;margin:10px 0}
.priceRow{display:flex;gap:10px;margin:12px 0}
.price{flex:1;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;background:var(--panel)}
.price.sel{border-color:var(--gold);box-shadow:0 0 16px rgba(255,198,61,.3)}
.price .amt{font-size:22px;font-weight:800;color:var(--gold)}
.price .per{font-size:11px;color:var(--dim)}
.feature{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:14px}
.feature .ic{font-size:18px}
.codeBox{font-size:30px;letter-spacing:8px;text-align:center;font-weight:800;color:var(--green);background:var(--panel);border:1px dashed var(--green);border-radius:14px;padding:14px;margin:12px 0}
input.txt{width:100%;font:inherit;font-size:20px;letter-spacing:6px;text-align:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);margin:8px 0}
.spinner{width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--purple);border-radius:50%;margin:20px auto;animation:spin 1s linear infinite}
/* rules table */
.rt{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}
.rt td,.rt th{border:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.rt th{background:var(--panel2)}
.notice{border:1px solid #8a5a3c;background:#2a1c12;color:#ffcfa8;border-radius:12px;padding:10px;font-size:12px;margin:10px 0}
.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.statBox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.statBox b{display:block;font-size:22px;color:var(--gold)}
.statBox span{font-size:11px;color:var(--dim)}
.ach{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin:6px 0}
.ach.locked{opacity:.4}
.ach .ic{font-size:22px}
.ach .t b{display:block;font-size:13px}
.ach .t span{font-size:11px;color:var(--dim)}
</style>
</head>
<body>
<div id="app">
  <div id="homeScr" class="screen"></div>
  <div id="gameScr" class="screen"></div>
  <div id="colScr" class="screen"></div>
  <div id="lobbyScr" class="screen"></div>
  <div id="payScr" class="screen"></div>
  <div id="rulesScr" class="screen"></div>
  <div id="setScr" class="screen"></div>
  <div id="profScr" class="screen"></div>
</div>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="logDrawer"><h3 style="margin:0 0 8px">Match Log <button style="float:right;color:var(--dim);font-size:20px" onclick="UI.toggleLog(false)">✕</button></h3><div id="logBody"></div></div>
<div id="toast"></div>
<div id="turnBanner"></div>
<script>
"use strict";
/* =====================================================================
   INTO THE ECHOSIDE — digital edition
   Card data compiled from the official 2016 how-to-play video, archived
   official site pages, and photographed cards. Entries marked v:"recon"
   have reconstructed effects (official text not publicly documented) —
   replace with licensed card text before commercial release.
   Types: DC=Dark Carnival, PSY=Psychopathic, UG=Underground crews.
===================================================================== */
const TYPE_META = {
  DC:{label:"Dark Carnival", color:"var(--dc)", hex:"#c13dff", glyph:"🎪"},
  PSY:{label:"Psychopathic", color:"var(--psy)", hex:"#ff3d5e", glyph:"💀"},
  UG:{label:"Underground", color:"var(--ug)", hex:"#3aa0ff", glyph:"🎤"},
  ITEM:{label:"Item", color:"var(--item)", hex:"#ffc63d", glyph:"🧰"},
  FIEND:{label:"Fiend", color:"var(--fiend)", hex:"#7dff3d", glyph:"👹"},
  EPIC:{label:"Epic", color:"var(--epic)", hex:"#ff8c3a", glyph:"🌟"},
  FLAVOR:{label:"Flavor", color:"var(--flavor)", hex:"#3affe0", glyph:"🃏"},
  JUG:{label:"Juggalo", color:"var(--jug)", hex:"#c9c9c9", glyph:"🤡"},
  START:{label:"Starter", color:"var(--start)", hex:"#9a9a9a", glyph:"🥷"}
};
const CREWS = ["DC","PSY","UG"];

// fx op reference: k, draw, drawFlavor, drawKeep{draw,keep}, drawDiscard{draw,discard},
// abolish{from,max,opt}, or{la,a,lb,b}, obtain{maxCost,from,itemOnly}, obtainJuggalo,
// kgShield, chooseCrew, revealTopSelf, revealTopMain, shuffleBack{maxCost,max},
// fromDiscard{crew,dest,opt}, flavorDiscardToHand, wheel{n}, galleryWipe{max},
// oppDiscardItems{all}, copyGallery{maxCost}, copyEpicTier, copyInPlay{maxCost},
// sugarSlam, hocusPocus, condDC{n}, abolishSelfK{n}, peekOppHand, fromAbyss{maxCost}
const DB = [
// ---- starters ----
{id:"ninja",n:"Ninja",t:"START",cost:0,gp:0,copies:0,v:"official",fx:[{op:"k",n:1}],txt:"+1 Karma."},
{id:"hound_dogs",n:"Hound Dogs",t:"START",cost:0,gp:0,copies:0,v:"official",fx:[{op:"chooseCrew"}],txt:"Choose a Crew; this card becomes that Crew until the end of your turn."},
// ---- Dark Carnival ----
{id:"loons",n:"The Loons",t:"DC",cost:2,gp:1,copies:3,v:"official",fx:[{op:"k",n:2}],txt:"+2 Karma."},
{id:"amy_attic",n:"Amy in the Attic",t:"DC",cost:4,gp:1,copies:3,v:"official",fx:[{op:"k",n:2},{op:"abolish",from:["hand","discard"],max:1,opt:1}],txt:"+2 Karma & you may abolish a card from your hand or discard pile."},
{id:"killer_carney",n:"Killer Carney",t:"DC",cost:3,gp:1,copies:3,v:"official",fx:[{op:"or",la:"+1 Karma & you may abolish a card from your hand or discard pile",a:[{op:"k",n:1},{op:"abolish",from:["hand","discard"],max:1,opt:1}],lb:"Abolish this card to gain +2 Karma",b:[{op:"abolishSelfK",n:2}]}],txt:"+1 Karma & you may abolish a card from your hand or discard pile OR abolish this card to gain +2 Karma."},
{id:"wicked_clowns",n:"Wicked Clowns",t:"DC",cost:3,gp:1,copies:2,v:"recon",fx:[{op:"k",n:2}],txt:"+2 Karma."},
{id:"superballs",n:"Superballs",t:"DC",cost:3,gp:1,copies:2,v:"recon",fx:[{op:"k",n:1},{op:"abolish",from:["hand"],max:1,opt:1}],txt:"+1 Karma & you may abolish a card from your hand."},
{id:"willoughby_rags",n:"Willoughby Rags",t:"DC",cost:4,gp:1,copies:2,v:"recon",fx:[{op:"k",n:1},{op:"drawFlavor",n:1}],txt:"+1 Karma & draw a Flavor card."},
{id:"cartoon_nightmares",n:"Cartoon Nightmares",t:"DC",cost:5,gp:2,copies:2,v:"partial",fx:[{op:"condDC",n:3,base:1}],txt:"+1 Karma. If you have another Dark Carnival card in play, +3 Karma instead."},
{id:"wizard_hood",n:"Wizard of the Hood",t:"DC",cost:5,gp:2,copies:2,v:"official",fx:[{op:"k",n:2},{op:"shuffleBack",maxCost:4,max:2}],txt:"+2 Karma & you may shuffle up to 2 cards of cost 4 or less from your discard pile into your deck."},
{id:"bpb",n:"Bang! Pow! Boom!",t:"DC",cost:7,gp:2,copies:2,v:"official",fx:[{op:"k",n:2},{op:"revealTopMain"}],txt:"+2 Karma & reveal the top card of the Main Deck; then abolish it or obtain it for free."},
{id:"wraith",n:"The Wraith",t:"DC",cost:7,gp:2,copies:2,v:"official",fx:[{op:"k",n:2},{op:"fromDiscard",crew:"DC",dest:"hand",opt:1}],txt:"+2 Karma & you may put a Dark Carnival card from your discard pile into your hand."},
{id:"mighty_death_pop",n:"Mighty Death Pop",t:"DC",cost:8,gp:3,copies:2,v:"partial",fx:[{op:"k",n:2},{op:"abolish",from:["hand","discard"],max:2,opt:1}],txt:"+2 Karma & you may abolish up to 2 cards from your hand and/or discard pile."},
// ---- Psychopathic ----
{id:"homies",n:"Homies",t:"PSY",cost:3,gp:1,copies:2,v:"official",fx:[{op:"k",n:2},{op:"revealTopSelf"}],txt:"+2 Karma & reveal the top card of your deck; you may discard it or return it face down."},
{id:"natalie",n:"Natalie the Ring Girl",t:"PSY",cost:3,gp:1,copies:2,v:"official",fx:[{op:"drawDiscard",draw:2,discard:1}],txt:"Draw 2 cards; then discard 1 card from your hand."},
{id:"psy_soldiers",n:"Psychopathic Soldiers",t:"PSY",cost:3,gp:1,copies:2,v:"official",fx:[{op:"k",n:1},{op:"abolish",from:["hand","discard"],max:1,opt:1}],txt:"+1 Karma & you may abolish a card from your hand or discard pile."},
{id:"jcw",n:"JCW Wrestling",t:"PSY",cost:3,gp:1,copies:1,v:"partial",shield:1,stomp:1,fx:[{op:"draw",n:1}],reaction:{cost:"discardSelf",after:[{op:"draw",n:1}]},txt:"Draw a card OR discard this card to stomp an opponent's card being played; then draw a card."},
{id:"kevin_gill",n:"K.G. Kevin Gill",t:"PSY",cost:4,gp:1,copies:2,v:"official",fx:[{op:"k",n:2},{op:"kgShield"}],txt:"+2 Karma & none of your cards (including Fiends) can be stomped this turn."},
{id:"soopa_ninjas",n:"Soopa Ninjas",t:"PSY",cost:4,gp:1,copies:2,v:"official",fx:[{op:"k",n:1},{op:"draw",n:1}],txt:"+1 Karma & draw a card."},
{id:"legs_diamond",n:"Legs Diamond",t:"PSY",cost:5,gp:2,copies:2,v:"official",fx:[{op:"obtain",maxCost:5}],txt:"Obtain a card of cost 5 or less for free."},
{id:"sugar_slam",n:"Sugar Slam",t:"PSY",cost:5,gp:2,copies:1,v:"official",fx:[{op:"sugarSlam"}],txt:"+2 Karma OR if this is the first card you played this turn, discard the rest of your hand and draw 5 new cards."},
{id:"jumpsteady",n:"Jumpsteady",t:"PSY",cost:5,gp:2,copies:2,v:"official",fx:[{op:"draw",n:2}],txt:"Draw 2 cards."},

/* ======================= HELPERS ======================= */
let uidC=0;
function mk(id){ return {u:++uidC,id,d:DEF[id],crewOverride:null,tilted:false}; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function crewOf(c){ if(c.crewOverride) return c.crewOverride; if(c.d.t==="JUG") return c.d.crew; return CREWS.includes(c.d.t)?c.d.t:null; }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms/(S.data.set.speed||1))); }
function d12(){ return 1+Math.floor(Math.random()*12); }
function buzz(ms){ if(S.data.set.haptics && navigator.vibrate) navigator.vibrate(ms); }

/* ======================= GAME STATE ======================= */
let G = null;
function newPlayer(name,isAI){
  const deck = [];
  for(let i=0;i<7;i++) deck.push(mk("ninja"));
  for(let i=0;i<3;i++) deck.push(mk("hound_dogs"));
  shuffle(deck);
  return {name,isAI,deck,hand:[],discard:[],inPlay:[],items:[],fiends:[],karma:0,
    unityUsed:false,epicBought:0,kg:false,hocus:false,playedCount:0,turns:0,stompAskOff:false};
}
function newGame(advanced, online){
  uidC=0;
  const main=[], flavor=[], epics=[], jug=[];
  DB.forEach(d=>{
    if(d.t==="START") return;
    if(d.t==="FLAVOR"){ for(let i=0;i<d.copies;i++) flavor.push(mk(d.id)); return; }
    if(d.t==="EPIC"){ epics.push(mk(d.id)); return; }
    if(d.t==="JUG"){ for(let i=0;i<d.copies;i++) jug.push(mk(d.id)); return; }
    if(!advanced && (d.t==="FIEND" || d.advanced)) return;
    for(let i=0;i<d.copies;i++) main.push(mk(d.id));
  });
  shuffle(main); shuffle(flavor); shuffle(epics); shuffle(jug);
  epics.splice(0,4); // 2-player: remove 4 unseen
  G = { advanced, online, main, flavor, flavorDis:[], abyss:[],
    epicDeck:epics, epicTier:[epics.pop(),epics.pop(),epics.pop()],
    gallery:[], jug, players:[newPlayer("You",false), newPlayer(online?"Wicked_Jester_66":"Nethervoid AI",true)],
    active:0, turnN:1, over:false, endTriggered:false, log:[] };
  for(let i=0;i<6;i++) G.gallery.push(G.main.pop()||null);
  G.players.forEach(p=>drawN(p,5));
  return G;
}
function opp(p){ return G.players[p===G.players[0]?1:0]; }
function me(){ return G.players[0]; }
function log(msg){ G.log.push(msg); UI.logChanged(); }

function drawN(p,n){
  for(let i=0;i<n;i++){
    if(!p.deck.length){
      if(!p.discard.length) return;
      p.deck = shuffle(p.discard.splice(0));
    }
    p.hand.push(p.deck.pop());
  }
}
function drawFlavorN(p,n){
  for(let i=0;i<n;i++){
    if(!G.flavor.length){ if(!G.flavorDis.length) return; G.flavor = shuffle(G.flavorDis.splice(0)); }
    p.hand.push(G.flavor.pop());
  }
}
function toDiscard(p,c){ if(c.d.t==="FLAVOR") G.flavorDis.push(c); else p.discard.push(c); }
function removeFrom(arr,c){ const i=arr.indexOf(c); if(i>=0) arr.splice(i,1); return c; }
function allOwned(p){ return [...p.deck,...p.hand.filter(c=>c.d.t!=="FLAVOR"),...p.discard,...p.inPlay.filter(c=>c.d.t!=="FLAVOR"),...p.items,...p.fiends]; }
function scoreGP(p){ return allOwned(p).reduce((s,c)=>s+(c.d.gp||0),0); }
function crewCounts(p){
  const n={DC:0,PSY:0,UG:0};
  [...p.inPlay,...p.fiends,...p.items].forEach(c=>{ const cr=crewOf(c); if(cr) n[cr]++; });
  return n;
}
function unityReady(p){ if(p.unityUsed) return null; const n=crewCounts(p); const r=CREWS.filter(c=>n[c]>=3); return r.length?r:null; }
function cardValue(c){ return (c.d.gp||0)*2 + (c.d.cost||0)*.3 + (c.d.t==="EPIC"?3:0); }
function junk(c){ return c.d.t==="START" || (c.d.gp||0)===0; }

/* ======================= CHOICE ROUTING (human=UI, AI=heuristics) ======================= */
async function pickCards(p,opts){ // {title,sub,cards,min,max,purpose,skip}
  if(!opts.cards.length) return [];
  if(p.isAI) return AI.pickCards(p,opts);
  return UI.pick(opts);
}
async function pickOption(p,title,labels,meta){
  if(p.isAI) return AI.pickOption(p,title,labels,meta);
  return UI.choice(title,labels,meta);
}

/* ======================= EFFECT ENGINE ======================= */
async function runOps(p,ops,ctx){ for(const o of (ops||[])) { if(G.over) return; await runOp(p,o,ctx||{}); } }
async function runOp(p,o,ctx){
  switch(o.op){
  case "k": p.karma+=o.n; log(`<b>${p.name}</b> +${o.n} Karma (${p.karma})`); if(p.karma>=15) unlock("big_turn"); break;
  case "draw": drawN(p,o.n); log(`<b>${p.name}</b> draws ${o.n}`); break;
  case "drawFlavor": drawFlavorN(p,o.n); log(`<b>${p.name}</b> draws ${o.n} Flavor`); break;
  case "drawKeep": {
    const tmp=[]; for(let i=0;i<o.draw;i++){ if(!p.deck.length && p.discard.length) p.deck=shuffle(p.discard.splice(0)); if(p.deck.length) tmp.push(p.deck.pop()); }
    if(!tmp.length) break;
    const kept = await pickCards(p,{title:`Keep ${o.keep}`,sub:"The rest are discarded.",cards:tmp,min:Math.min(o.keep,tmp.length),max:Math.min(o.keep,tmp.length),purpose:"keep"});
    tmp.forEach(c=>{ if(kept.includes(c)) p.hand.push(c); else toDiscard(p,c); });
    log(`<b>${p.name}</b> draws ${tmp.length}, keeps ${kept.length}`); break; }
  case "drawFlavorKeep": {
    const tmp=[]; for(let i=0;i<o.draw;i++){ if(!G.flavor.length && G.flavorDis.length) G.flavor=shuffle(G.flavorDis.splice(0)); if(G.flavor.length) tmp.push(G.flavor.pop()); }
    if(!tmp.length) break;
    const kept = await pickCards(p,{title:`Keep ${o.keep} Flavor cards`,cards:tmp,min:Math.min(o.keep,tmp.length),max:Math.min(o.keep,tmp.length),purpose:"keep"});
    tmp.forEach(c=>{ if(kept.includes(c)) p.hand.push(c); else G.flavorDis.push(c); });
    break; }
  case "drawDiscard": {
    if(o.opt){ const ch = await pickOption(p,"Discard a card to draw a card?",["Yes","No"],{purpose:"optDrawDiscard"}); if(ch===1) break; }
    drawN(p,o.draw);
    const ds = await pickCards(p,{title:`Discard ${o.discard}`,cards:p.hand.slice(),min:Math.min(o.discard,p.hand.length),max:Math.min(o.discard,p.hand.length),purpose:"discard"});
    ds.forEach(c=>{ removeFrom(p.hand,c); toDiscard(p,c); });
    log(`<b>${p.name}</b> draws ${o.draw}, discards ${ds.length}`); break; }
  case "abolish": {
    const pool=[]; if(o.from.includes("hand")) pool.push(...p.hand); if(o.from.includes("discard")) pool.push(...p.discard);
    const sel = await pickCards(p,{title:`Abolish up to ${o.max}`,sub:"Chosen cards are removed from the game (the Abyss).",cards:pool,min:o.opt?0:Math.min(o.max,pool.length),max:o.max,purpose:"abolish",skip:!!o.opt,zoneOf:c=>p.hand.includes(c)?"hand":"discard"});
    sel.forEach(c=>{ removeFrom(p.hand,c); removeFrom(p.discard,c); G.abyss.push(c); S.data.stats.abolished++; });
    if(sel.length){ log(`<b>${p.name}</b> abolishes ${sel.map(c=>c.d.n).join(", ")}`); S.save(); if(S.data.stats.abolished>=25) unlock("abolisher"); }
    break; }
  case "abolishSelfK": if(ctx.card){ removeFrom(p.inPlay,ctx.card); G.abyss.push(ctx.card); } p.karma+=o.n; log(`<b>${p.name}</b> abolishes ${ctx.card?ctx.card.d.n:"card"} for +${o.n} Karma`); break;
  case "or": {
    const ch = await pickOption(p,"Choose one:",[o.la,o.lb],{purpose:"or",ctx});
    await runOps(p, ch===0?o.a:o.b, ctx); break; }
  case "chooseCrew": {
    const n=crewCounts(p);
    let cr;
    if(p.isAI){ cr = CREWS.slice().sort((a,b)=>n[b]-n[a])[0]; }
    else { const ch = await pickOption(p,"Choose a Crew for "+(ctx.card?ctx.card.d.n:"this card"),CREWS.map(c=>TYPE_META[c].glyph+" "+TYPE_META[c].label),{purpose:"crew"}); cr=CREWS[ch]; }
    if(ctx.card) ctx.card.crewOverride=cr;
    log(`<b>${p.name}</b>: ${ctx.card?ctx.card.d.n:""} becomes ${TYPE_META[cr].label}`); break; }
  case "kgShield": p.kg=true; log(`<b>${p.name}</b> is protected from stomps this turn`); break;
  case "hocusPocus": p.hocus=true; break;
  case "condDC": {
    const others = p.inPlay.filter(c=>c!==ctx.card && crewOf(c)==="DC").length;
    const gain = others>=1?o.n:o.base; p.karma+=gain; log(`<b>${p.name}</b> +${gain} Karma (${p.karma})`); break; }
  case "revealTopSelf": {
    if(!p.deck.length && p.discard.length) p.deck=shuffle(p.discard.splice(0));
    if(!p.deck.length) break;
    const top=p.deck[p.deck.length-1];
    const ch = await pickOption(p,`Top of your deck: ${top.d.n} — ${top.d.txt}`,["Discard it","Return it face down"],{purpose:"revealSelf",card:top});
    if(ch===0){ p.deck.pop(); toDiscard(p,top); log(`<b>${p.name}</b> discards ${top.d.n} from top of deck`); }
    break; }
  case "shovel": {
    if(!p.deck.length && p.discard.length) p.deck=shuffle(p.discard.splice(0));
    if(!p.deck.length) break;
    const top=p.deck[p.deck.length-1];
    if((top.d.cost||0)<=3){ p.deck.pop(); p.hand.push(top); log(`<b>${p.name}</b>'s Shovel digs up ${top.d.n}`); if(!p.isAI) UI.toast(`⛏️ Dug up: ${top.d.n}`);}
    else { log(`<b>${p.name}</b>'s Shovel reveals ${top.d.n} (too heavy — returned)`); if(!p.isAI) UI.toast(`Top card: ${top.d.n} (cost ${top.d.cost}) — returned`);}
    break; }
  case "cloak": { const g = p.fiends.length?2:1; p.karma+=g; log(`<b>${p.name}</b> +${g} Karma (Murda Cloak)`); break; }
  case "revealTopMain": {
    const top=G.main.pop(); if(!top) break;
    const ch = await pickOption(p,`Top of Main Deck: ${top.d.n} (cost ${top.d.cost}) — ${top.d.txt}`,["Obtain it for free","Abolish it"],{purpose:"revealMain",card:top});
    if(ch===0){ await gainCard(p,top,"free"); } else { G.abyss.push(top); log(`<b>${p.name}</b> abolishes ${top.d.n} off the Main Deck`); }
    break; }
  case "shuffleBack": {
    const pool=p.discard.filter(c=>(c.d.cost||0)<=o.maxCost);
    const sel = await pickCards(p,{title:`Shuffle up to ${o.max} into your deck`,cards:pool,min:0,max:o.max,purpose:"recover",skip:true});
    sel.forEach(c=>{ removeFrom(p.discard,c); p.deck.push(c); });
    if(sel.length){ shuffle(p.deck); log(`<b>${p.name}</b> shuffles ${sel.length} card(s) back into deck`); }
    break; }
  case "fromDiscard": {
    let pool=p.discard.filter(c=>(!o.crew||crewOf(c)===o.crew)&&(!o.nonEpic||c.d.t!=="EPIC")&&(o.maxCost==null||(c.d.cost||0)<=o.maxCost));
    const sel = await pickCards(p,{title:o.dest==="top"?"Place on top of your deck":"Put into your hand",cards:pool,min:o.opt?0:Math.min(1,pool.length),max:1,purpose:"recover",skip:!!o.opt});
    if(sel[0]){ removeFrom(p.discard,sel[0]); if(o.dest==="top") p.deck.push(sel[0]); else p.hand.push(sel[0]); log(`<b>${p.name}</b> recovers ${sel[0].d.n}`); }
    break; }
  case "fromAbyss": {
    const pool=G.abyss.filter(c=>(c.d.cost||0)<=o.maxCost && c.d.t!=="FLAVOR");
    const sel = await pickCards(p,{title:"Obtain from the Abyss",cards:pool,min:0,max:1,purpose:"obtain",skip:true});
    if(sel[0]){ removeFrom(G.abyss,sel[0]); await gainCard(p,sel[0],"free"); }
    break; }
  case "flavorDiscardToHand": {
    const sel = await pickCards(p,{title:"Take from Flavor discard",cards:G.flavorDis.slice(),min:0,max:1,purpose:"obtain",skip:true});
    if(sel[0]){ removeFrom(G.flavorDis,sel[0]); p.hand.push(sel[0]); log(`<b>${p.name}</b> takes ${sel[0].d.n} from the Flavor discard`); }
    break; }
  case "obtain": {
    let pool=G.gallery.filter(c=>c&&(c.d.cost||0)<=o.maxCost&&(!o.itemOnly||c.d.t==="ITEM"));
    if(!o.itemOnly && G.jug.length && 3<=o.maxCost) pool=pool.concat([G.jug[G.jug.length-1]]);
    if(!pool.length){ if(!p.isAI) UI.toast("Nothing eligible to obtain."); break; }
    const sel = await pickCards(p,{title:`Obtain a card (cost ≤ ${o.maxCost}) for free`,cards:pool,min:o.opt?0:1,max:1,purpose:"obtain",skip:!!o.opt});
    if(sel[0]){
      const c=sel[0];
      const gi=G.gallery.indexOf(c);
      if(gi>=0){ G.gallery[gi]=null; galleryRefillCheck(p); } else if(G.jug[G.jug.length-1]===c){ G.jug.pop(); }
      await gainCard(p,c,"free");
    }
    break; }
  case "obtainJuggalo": if(G.jug.length){ const c=G.jug.pop(); await gainCard(p,c,"free"); } break;
  case "wheel": for(let i=0;i<o.n;i++){ if(G.over) break; await spinWheel(p); } break;
  case "galleryWipe": {
    const pool=G.gallery.filter(c=>c);
    const sel = await pickCards(p,{title:`Abolish up to ${o.max} Gallery cards`,sub:"They are replaced immediately.",cards:pool,min:0,max:o.max,purpose:"wipe",skip:true});
    sel.forEach(c=>{ const i=G.gallery.indexOf(c); G.gallery[i]=G.main.pop()||null; G.abyss.push(c); });
    if(sel.length) log(`<b>${p.name}</b> wipes ${sel.length} Gallery card(s)`);
    checkEndTriggers(); break; }
  case "oppDiscardItems": {
    const q=opp(p);
    if(!q.items.length) break;
    const ch = await pickOption(p,`Force ${q.name} to discard all Items in play? (${q.items.map(c=>c.d.n).join(", ")})`,["Yes — discard them","No"],{purpose:"oppItems"});
    if(ch===0){ const n=q.items.length; q.items.splice(0).forEach(c=>q.discard.push(c)); log(`<b>${q.name}</b> discards ${n} Item(s)!`); buzz(60); }
    break; }
  case "peekOppHand": {
    const q=opp(p);
    if(!q.hand.length) break;
    const sel = await pickCards(p,{title:`${q.name}'s hand — choose 1 to discard`,cards:q.hand.slice(),min:1,max:1,purpose:"handAttack"});
    if(sel[0]){ removeFrom(q.hand,sel[0]); toDiscard(q,sel[0]); log(`<b>${p.name}</b> forces ${q.name} to discard ${sel[0].d.n}`); }
    break; }
  case "copyGallery": {
    const pool=G.gallery.filter(c=>c&&CREWS.includes(c.d.t)&&(c.d.cost||0)<=o.maxCost&&c.d.fx);
    const sel = await pickCards(p,{title:"Copy a Gallery Crew card's effect",cards:pool,min:0,max:1,purpose:"copy",skip:true});
    if(sel[0]){ log(`<b>${p.name}</b> copies ${sel[0].d.n}`); await runOps(p,sel[0].d.fx,{card:ctx.card}); }
    break; }
  case "copyEpicTier": {
    const pool=G.epicTier.filter(c=>c&&c.d.fx);
    const sel = await pickCards(p,{title:"Copy an Epic Tier effect",cards:pool,min:0,max:1,purpose:"copy",skip:true});
    if(sel[0]){ log(`<b>${p.name}</b> copies ${sel[0].d.n}`); await runOps(p,sel[0].d.fx,{card:ctx.card}); }
    break; }
  case "copyInPlay": {
    const pool=p.inPlay.filter(c=>c!==ctx.card&&(c.d.t==="START"||CREWS.includes(c.d.t))&&(c.d.cost||0)<=o.maxCost&&c.d.fx);
    const sel = await pickCards(p,{title:"Copy a card you have in play (cost ≤ 4)",cards:pool,min:0,max:1,purpose:"copy",skip:true});
    if(sel[0]){ log(`<b>${p.name}</b> copies ${sel[0].d.n}`); await runOps(p,sel[0].d.fx,{card:ctx.card}); }
    break; }
  case "sugarSlam": {
    if(p.playedCount===1 && p.hand.length){
      const ch=await pickOption(p,"Sugar Slam",["+2 Karma","Discard the rest of your hand and draw 5 new cards"],{purpose:"sugar"});
      if(ch===1){ const n=p.hand.length; p.hand.splice(0).forEach(c=>toDiscard(p,c)); drawN(p,5); log(`<b>${p.name}</b> mulligans ${n} cards for a fresh 5`); break; }
    }
    p.karma+=2; log(`<b>${p.name}</b> +2 Karma (${p.karma})`); break; }
  case "mulligan": { const n=p.hand.length; p.hand.splice(0).forEach(c=>toDiscard(p,c)); drawN(p,5); log(`<b>${p.name}</b> discards ${n} and draws 5 (Pit Demoness)`); break; }
  }
  UI.render();
}

/* ======================= GAIN / BUY ======================= */
async function gainCard(p,c,how){
  // routing: Fiends → in play; Items w/ Hocus Pocus → hand; Crew ≤5 w/ Hatchetman Charm → may top-deck
  if(c.d.t==="FIEND"){ p.fiends.push(c); log(`<b>${p.name}</b> ${how==="free"?"obtains":"buys"} Fiend <b>${c.d.n}</b> — into play`); return; }
  if(c.d.t==="ITEM" && p.hocus){ p.hocus=false; p.hand.push(c); log(`<b>${p.name}</b> puts ${c.d.n} into hand (Hocus Pocus)`); return; }
  const charm = p.items.find(i=>i.d.passive==="charm"&&!i.tilted);
  if(charm && CREWS.includes(c.d.t) && (c.d.cost||0)<=5){
    const ch = await pickOption(p,`Hatchetman Charm: place ${c.d.n} on top of your deck?`,["Top of deck","Discard pile (normal)"],{purpose:"charm"});
    if(ch===0){ charm.tilted=true; p.deck.push(c); log(`<b>${p.name}</b> tops the deck with ${c.d.n} (Charm)`); return; }
  }
  p.discard.push(c);
  log(`<b>${p.name}</b> ${how==="free"?"obtains":"buys"} <b>${c.d.n}</b>${how==="free"?"":" for "+c.d.cost}`);
}
function galleryRefillCheck(p){
  const juice = p.items.find(i=>i.d.passive==="juice");
  if(juice){ for(let i=0;i<6;i++) if(!G.gallery[i]) G.gallery[i]=G.main.pop()||null; checkEndTriggers(); }
}
async function buyGallery(p,i){
  const c=G.gallery[i];
  if(!c||p.karma<c.d.cost) return false;
  p.karma-=c.d.cost; G.gallery[i]=null;
  await gainCard(p,c,"buy"); buzz(20);
  galleryRefillCheck(p);
  if(G.tutorial && !p.isAI) TUT.on("buy",{card:c,zone:"gallery"});
  UI.render(); return true;
}
async function buyEpic(p,i){
  const c=G.epicTier[i];
  if(!c||p.karma<c.d.cost||p.epicBought>=1) return false;
  p.karma-=c.d.cost; G.epicTier[i]=null; p.epicBought++;
  S.data.stats.epics++; S.save();
  await gainCard(p,c,"buy"); buzz(40);
  UI.render(); return true;
}
async function buyJug(p){
  if(!G.jug.length||p.karma<3) return false;
  p.karma-=3; const c=G.jug.pop();
  await gainCard(p,c,"buy"); UI.render(); return true;
}
function cycleJug(p){
  if(!G.jug.length||p.karma<1) return false;
  p.karma-=1; G.jug.unshift(G.jug.pop());
  log(`<b>${p.name}</b> cycles the top Juggalo card`); UI.render(); return true;
}

/* ======================= STOMPS ======================= */
function stompers(q,pierceNeeded){
  const list=[];
  q.fiends.forEach(c=>{ if(c.d.reaction) list.push({card:c,from:"play",r:c.d.reaction}); });
  q.hand.forEach(c=>{ if(c.d.reaction) list.push({card:c,from:"hand",r:c.d.reaction}); });
  return pierceNeeded ? list.filter(s=>s.r.pierce) : list;
}
async function stompWindow(p,card){
  const q=opp(p);
  const protectedBy = card.d.shield?"shield":(p.kg?"kg":null);
  const avail = stompers(q, !!protectedBy);
  if(!avail.length) return false;
  let pick=null;
  if(q.isAI){
    const worth = (card.d.cost||0)>=5 || card.d.t==="EPIC";
    if(worth) pick = avail[0];
  } else if(G.tutorial && TUT.active && TUT.cur() && TUT.cur().id==="stomp"){
    const ch = await UI.choice(`🎓 ${p.name} plays ${card.d.n} — STOMP IT! Your Fiend abolishes itself to counter their card completely.`,
      avail.map(s=>`🥾 Stomp with ${s.card.d.n}`),{purpose:"stomp",card});
    pick=avail[ch];
  } else {
    if(!S.data.set.stompAsk || q.stompAskOff) return false;
    const ch = await UI.choice(`${p.name} plays ${card.d.n}${protectedBy?" (protected — only piercing stomps work)":""}. Stomp it?`,
      [...avail.map(s=>`🥾 Stomp with ${s.card.d.n}`),"Let it resolve","Let it resolve (stop asking this game)"],{purpose:"stomp",card});
    if(ch===avail.length+1){ q.stompAskOff=true; return false; }
    if(ch===avail.length) return false;
    pick=avail[ch];
  }
  if(!pick) return false;
  // pay cost
  if(pick.r.cost==="abolishSelf"){ removeFrom(q.fiends,pick.card); removeFrom(q.hand,pick.card); G.abyss.push(pick.card); }
  else { removeFrom(q.hand,pick.card); removeFrom(q.fiends,pick.card); toDiscard(q,pick.card); }
  // stomped card → its discard
  removeFrom(p.inPlay,card); toDiscard(p,card);
  S.data.stats.stomps++; S.save(); if(S.data.stats.stomps>=10) unlock("stomper");
  log(`🥾 <b>${q.name}</b> STOMPS ${card.d.n} with ${pick.card.d.n}!`);
  buzz(80);
  if(!q.isAI) UI.toast("🥾 You stomped "+card.d.n+"!"); else UI.toast("🥾 "+q.name+" stomped your "+card.d.n+"!");
  await runOps(q,pick.r.after,{});
  if(G.tutorial && !q.isAI) TUT.on("stomp");
  return true;
}

/* ======================= TURN FLOW ======================= */
async function playCard(p,c){
  if(G.over) return;
  removeFrom(p.hand,c);
  p.inPlay.push(c);
  p.playedCount++;
  log(`<b>${p.name}</b> plays <b>${c.d.n}</b>`);
  UI.render();
  const stomped = await stompWindow(p,c);
  if(!stomped && c.d.fx) await runOps(p,c.d.fx,{card:c});
  if(G.tutorial && !p.isAI) TUT.on("play",{card:c});
  UI.render();
}
async function useItem(p,c){
  if(c.tilted||!c.d.active) return;
  c.tilted=true;
  log(`<b>${p.name}</b> uses ${c.d.n}`);
  await runOps(p,c.d.active,{card:c});
  UI.render();
}
async function useFiend(p,c){
  if(!c.d.fiendUse) return;
  if(c.d.useWhen==="ownStart" && p.playedCount>0){ UI.toast("Pit Demoness must be used before playing any cards."); return; }
  removeFrom(p.fiends,c);
  log(`<b>${p.name}</b> unleashes Fiend <b>${c.d.n}</b>`);
  await runOps(p,c.d.fiendUse,{card:c});
  G.abyss.push(c);
  UI.render();
}
async function claimUnity(p,crew){
  if(p.unityUsed) return;
  p.unityUsed=true;
  log(`<b>${p.name}</b> claims ${TYPE_META[crew].label} Unity`);
  if(crew==="DC") await runOps(p,[{op:"k",n:2}],{});
  if(crew==="PSY") await runOps(p,[{op:"draw",n:1}],{});
  if(crew==="UG") await runOps(p,[{op:"drawFlavor",n:1}],{});
  UI.render();
}
function checkEndTriggers(){
  if(G.endTriggered) return;
  if(!G.main.length && G.gallery.some(s=>!s)) { G.endTriggered=true; log("⚠️ <b>The Main Deck is exhausted — final turns!</b>"); }
}
async function endTurn(p){
  if(G.over) return;
  if(G.tutorial && !p.isAI) TUT.on("endTurn");
  // cleanup
  p.inPlay.splice(0).forEach(c=>{ c.crewOverride=null; toDiscard(p,c); });
  p.hand.splice(0).forEach(c=>toDiscard(p,c));
  p.karma=0; p.kg=false; p.hocus=false; p.unityUsed=false; p.epicBought=0; p.playedCount=0;
  // refill gallery
  for(let i=0;i<6;i++) if(!G.gallery[i]) G.gallery[i]=G.main.pop()||null;
  checkEndTriggers();
  // refill epic tier
  for(let i=0;i<3;i++) if(!G.epicTier[i]){
    if(G.epicDeck.length) G.epicTier[i]=G.epicDeck.pop();
    else if(!G.endTriggered){ G.endTriggered=true; log("⚠️ <b>The last Epic has been drawn — final turns!</b>"); }
  }
  if(!G.endTriggered && G.turnN>=70){ G.endTriggered=true; log("⚠️ <b>The Carnival closes its gates — final turns!</b>"); }
  drawN(p,5);
  p.turns++;
  log(`— <b>${p.name}</b> ends turn ${p.turns} —`);
  // equal turns rule
  if(G.endTriggered && G.players[0].turns===G.players[1].turns){ return gameOver(); }
  G.active = G.active?0:1;
  G.turnN++;
  UI.render();
  const np=G.players[G.active];
  await UI.banner(np.isAI?np.name+"'s Turn":"Your Turn");
  np.items.forEach(i=>i.tilted=false);
  if(np.isAI) await AI.takeTurn(np);
  else if(G.tutorial) TUT.on("turnStart");
}
function gameOver(){
  G.over=true;
  const [a,b]=G.players, sa=scoreGP(a), sb=scoreGP(b);
  let winner = sa>sb?a : sb>sa?b : null;
  if(!winner){ // tiebreak: epic GP
    const ea=allOwned(a).filter(c=>c.d.t==="EPIC").reduce((s,c)=>s+c.d.gp,0);
    const eb=allOwned(b).filter(c=>c.d.t==="EPIC").reduce((s,c)=>s+c.d.gp,0);
    winner = ea>eb?a : eb>ea?b : null;
  }
  S.data.stats.games++;
  if(winner===a){ S.data.stats.wins++; unlock("first_win"); }
  if(G.online){ S.data.stats.online++; unlock("online"); }
  const myEpics = allOwned(a).filter(c=>c.d.t==="EPIC").length;
  if(myEpics>=3) unlock("epic_hoard");
  S.save();
  UI.gameOver(winner,sa,sb);
}

/* ======================= AI ======================= */
const AI = {
  pickCards(p,opts){
    const {cards,purpose}=opts;
    let max=opts.max||1, min=opts.min||0;
    let sorted;
    switch(purpose){
    case "abolish": sorted=cards.filter(junk); return sorted.slice(0,max);
    case "wipe": return []; // AI doesn't bother wiping
    case "discard": sorted=cards.slice().sort((x,y)=>cardValue(x)-cardValue(y)); return sorted.slice(0,Math.max(min,0));
    case "keep": sorted=cards.slice().sort((x,y)=>cardValue(y)-cardValue(x)); return sorted.slice(0,max);
    case "obtain": case "copy": case "recover": case "handAttack":
      sorted=cards.slice().sort((x,y)=>cardValue(y)-cardValue(x));
      if(purpose==="handAttack") return sorted.slice(0,1);
      if(!sorted.length) return [];
      if((purpose==="recover"||purpose==="obtain") && junk(sorted[0]) && min===0) return [];
      return sorted.slice(0,Math.max(min,1)).slice(0,max);
    default:
      sorted=cards.slice().sort((x,y)=>cardValue(y)-cardValue(x));
      return sorted.slice(0,Math.max(min,0)||Math.min(1,max));
    }
  },
  pickOption(p,title,labels,meta){
    const pur=meta&&meta.purpose;
    if(pur==="revealMain"){ return meta.card && (meta.card.d.gp||0)>=1 ? 0 : 1; }
    if(pur==="revealSelf"){ return meta.card && junk(meta.card) ? 0 : 1; }
    if(pur==="oppItems") return 0;
    if(pur==="charm") return 0;
    if(pur==="sugar"){ const junkN=p.hand.filter(junk).length; return junkN>=3?1:0; }
    if(pur==="optDrawDiscard") return p.hand.some(junk)?0:1;
    return 0;
  },
  async takeTurn(p){
    await sleep(600);
    // Pit Demoness pre-play mulligan if hand is junky
    const pit=p.fiends.find(c=>c.d.id==="pit_demoness");
    if(pit && p.hand.filter(junk).length>=4){ await useFiend(p,pit); await sleep(500); }
    // play hand: draw effects first, then rest
    let guard=40;
    while(!G.over && guard-->0){
      const hand=p.hand.slice();
      if(!hand.length) break;
      const drawFirst = hand.find(c=>c.d.fx&&c.d.fx.some(o=>["draw","drawKeep","drawDiscard","drawFlavor"].includes(o.op)));
      const next = drawFirst||hand.sort((x,y)=>cardValue(y)-cardValue(x))[0];
      // hold stompers in hand vs playing them? AI plays them for value.
      await playCard(p,next);
      await sleep(450);
    }
    if(G.over) return;
    // items
    for(const it of p.items.slice()){ if(!it.tilted&&it.d.active){ await useItem(p,it); await sleep(350); } }
    // fiends with own-turn value
    for(const f of p.fiends.slice()){
      if(G.over) break;
      if(!f.d.fiendUse) continue;
      if(f.d.id==="pit_demoness") continue;
      const oppItems = opp(p).items.length;
      if((f.d.id==="witch"||f.d.id==="black_eyed") && oppItems===0 && G.turnN<14) continue;
      await useFiend(p,f); await sleep(400);
    }
    // unity
    const u=unityReady(p);
    if(u) { await claimUnity(p,u.sort((a,b)=>({DC:2,PSY:1,UG:0})[b]-({DC:2,PSY:1,UG:0})[a])[0]); await sleep(350); }
    if(G.over) return;
    // buys
    let bguard=8;
    while(!G.over && bguard-->0){
      const epicIdx = G.epicTier.findIndex(c=>c&&p.karma>=c.d.cost);
      if(epicIdx>=0 && p.epicBought<1){ await buyEpic(p,epicIdx); await sleep(450); continue; }
      let best=-1,bestV=-1;
      G.gallery.forEach((c,i)=>{ if(c&&p.karma>=c.d.cost){ const v=cardValue(c); if(v>bestV){bestV=v;best=i;} } });
      if(p.karma>=3 && G.jug.length && bestV<2){ await buyJug(p); await sleep(400); continue; }
      if(best>=0){ await buyGallery(p,best); await sleep(450); continue; }
      if(p.karma>=3 && G.jug.length){ await buyJug(p); await sleep(400); continue; }
      break;
    }
    await sleep(500);
    if(!G.over) await endTurn(p);
  }
};

const H={n:0,m:{}};
function act(fn){ H.m[++H.n]=fn; return `UI.act(${H.n})`; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function cardHTML(c,size,opts){
  opts=opts||{};
  const d=c.d||c;
  const m=TYPE_META[d.t];
  const icons=(d.shield?"🛡":"")+(d.stomp||d.reaction?"🥾":"");
  const cost=d.cost!=null?`<div class="cost">${d.cost}</div>`:"";
  const gp=d.gp?`<div class="gp">${d.gp}GP</div>`:"";
  const crew = d.t==="JUG"?` <span style="color:${TYPE_META[d.crew].color}">·${TYPE_META[d.crew].label.split(" ")[0]}</span>`:"";
  const ov = c.crewOverride?` <span style="color:${TYPE_META[c.crewOverride].color}">→${c.crewOverride}</span>`:"";
  const cls=`card ${size} ${c.tilted?"tilted":""} ${opts.sel?"sel":""} ${opts.dis?"dis":""}`;
  const click=opts.onTap?`onclick="${opts.onTap}"`:"";
  return `<div class="${cls}" style="--c1:${m.color};--tc:${m.color}" ${click}>
    <div class="art">${cost}${gp}<img src="assets/cards/${d.id}.jpg" alt="" onerror="this.remove()"><span>${m.glyph}</span><div class="icons">${icons}</div></div>
    <div class="nm">${esc(d.n)}</div><div class="ty">${m.label}${crew}${ov}</div></div>`;
}
function vTag(d){
  if(d.v==="official") return `<span class="tag gold">✓ official text</span>`;
  if(d.v==="partial") return `<span class="tag recon">◐ partially confirmed</span>`;
  return `<span class="tag recon">⚠ reconstructed effect</span>`;
}

        <div class="pile" onclick="${act(()=>UI.viewPile("Flavor discard",G.flavorDis))}"><b>${G.flavorDis.length}</b>Flavor<br>discard</div>
        <div class="pile" onclick="${act(()=>UI.viewPile("The Abyss",G.abyss))}"><b>${G.abyss.length}</b>Abyss 🕳</div>
        <div class="pile" onclick="${act(()=>UI.viewPile("Your discard",p.discard))}"><b>${p.discard.length}</b>Your<br>discard</div>
        <div class="pile facedown"><b>${p.deck.length}</b>Your<br>deck</div>
      </div>
      ${(p.items.length||p.fiends.length)?`<div class="zoneLbl">Your Items & Fiends</div><div class="rowScroll">
        ${p.items.map(c=>cardHTML(c,"cardS",{onTap:act(()=>UI.ownPermanent(c,"item"))})).join("")}
        ${p.fiends.map(c=>cardHTML(c,"cardS",{onTap:act(()=>UI.ownPermanent(c,"fiend"))})).join("")}</div>`:""}
      ${p.inPlay.length?`<div class="zoneLbl">You — in play ${p.kg?"· 🛡 KG protection":""}</div><div class="rowScroll" id="inPlayRow">${p.inPlay.map(c=>cardHTML(c,"cardS",{onTap:act(()=>UI.bigCard(c))})).join("")}</div>`:""}
    </div>
    <div class="handWrap">
      <div class="handBar">
        <span class="karmaBig">☯ ${p.karma}</span>
        <span class="gpBig">${scoreGP(p)} GP</span>
        <span style="font-size:10px;color:var(--dim)">${CREWS.map(c=>`<span style="color:${TYPE_META[c].color}">${c}:${nCounts[c]}</span>`).join(" ")}</span>
        ${un?`<button class="unityBtn ready" onclick="${act(()=>UI.unitySheet(un))}">UNITY!</button>`:(p.unityUsed?'<span class="tag">unity used</span>':"")}
        <button class="endBtn" ${myTurn?"":"disabled"} onclick="${act(()=>UI.tryEndTurn())}">End Turn</button>
      </div>
      <div id="hand">${p.hand.length?p.hand.map(c=>cardHTML(c,"cardM",{onTap:act(()=>UI.handCard(c))})).join(""):'<div class="sub" style="padding:20px">No cards in hand</div>'}</div>
    </div>`;
    if(ts&&ts.hi){ const el=scr.querySelector(ts.hi); if(el) el.classList.add("tutHi"); }
    this.logChanged();
  },
  guard(){ if(!G||G.over){return false;} if(G.active!==0){this.toast("Not your turn.");return false;} if(G.busy){return false;} return true; },
  async wrap(fn){ if(!this.guard())return; G.busy=true; try{ await fn(); } finally { G.busy=false; this.render(); } },
  handCard(c){
    const mine=G.active===0&&!G.over;
    this.bigCard(c,[{label:"▶ Play card",dis:!mine,fn:()=>{ if(!TUT.allow("play",{card:c})){UI.toast(TUT.hintTxt());return;} this.wrap(async()=>{ beep(600,.04); await playCard(me(),c); }); }}]);
  },
  marketCard(c,zone,i){
    const p=me(); const mine=G.active===0&&!G.over;
    const afford=p.karma>=(c.d.cost||0);
    const epicBlock=zone==="epic"&&p.epicBought>=1;
    this.bigCard(c,[{label:epicBlock?"Epic already bought this turn":`💰 Buy for ${c.d.cost} Karma`,dis:!mine||!afford||epicBlock,
      fn:()=>{ if(!TUT.allow("buy",{card:c})){UI.toast(TUT.hintTxt());return;} this.wrap(async()=>{ beep(700,.05); zone==="epic"?await buyEpic(p,i):await buyGallery(p,i); }); }}]);
  },
  jugSheet(){
    const p=me(); const c=G.jug[G.jug.length-1]; const mine=G.active===0&&!G.over;
    this.bigCard(c,[
      {label:"💰 Buy for 3 Karma",dis:!mine||p.karma<3,fn:()=>{ if(!TUT.allow("buy",{card:c})){UI.toast(TUT.hintTxt());return;} this.wrap(async()=>{ await buyJug(p); }); }},
      {label:"🔄 Cycle to bottom (1 Karma)",cls:"",dis:!mine||p.karma<1,fn:()=>{ if(!TUT.allow("cycle",{})){UI.toast(TUT.hintTxt());return;} this.wrap(async()=>{ cycleJug(p); }); }}
    ]);
  },
  ownPermanent(c,kind){
    const mine=G.active===0&&!G.over;
    const btns=[];
    if(kind==="item"&&c.d.active) btns.push({label:c.tilted?"Already used this turn":"⚙️ Use item",dis:!mine||c.tilted,fn:()=>{ if(!TUT.allow("useItem",{})){UI.toast(TUT.hintTxt());return;} this.wrap(async()=>{ await useItem(me(),c); }); }});
    if(kind==="item"&&c.d.passive) btns.push({label:"Passive — works automatically",dis:true});
    if(kind==="fiend"&&c.d.fiendUse) btns.push({label:"👹 Unleash (one-time, then Abyss)",dis:!mine,fn:()=>{ if(!TUT.allow("useFiend",{})){UI.toast(TUT.hintTxt());return;} this.wrap(async()=>{ await useFiend(me(),c); }); }});
    if(kind==="fiend"&&c.d.reaction&&!c.d.fiendUse) btns.push({label:"Held to stomp — you'll be asked when "+G.players[1].name+" plays",dis:true});
    this.bigCard(c,btns);
  },
  unitySheet(crews){
    const lbl={DC:"🎪 Dark Carnival — +2 Karma",PSY:"💀 Psychopathic — draw a card",UG:"🎤 Underground — draw a Flavor card"};
    this.choice("Claim a Unity Benefit (once per turn)",crews.map(c=>lbl[c]).concat(["Not yet"]),{}).then(i=>{
      if(i<crews.length) this.wrap(async()=>{ beep(800,.06); await claimUnity(me(),crews[i]); });
    });
  },
  tryEndTurn(){
    const p=me();
    if(!TUT.allow("end",{})){ this.toast(TUT.hintTxt()); return; }
    if(!G.tutorial&&p.karma>=3&&G.jug.length){ this.choice(`You still have ${p.karma} Karma (a Juggalo costs 3). End turn anyway?`,["End turn — burn the Karma","Keep playing"],{}).then(i=>{ if(i===0) this.wrap(()=>endTurn(p)); }); return; }
    this.wrap(()=>endTurn(p));
  },
  menuSheet(){
    this._sheet(`<h3>Menu</h3>
      <button class="optBtn" onclick="${act(()=>{UI.closeSheet();})}">▶ Resume</button>
      <button class="optBtn" onclick="${act(()=>{UI.closeSheet();UI.rules();})}">📖 Rules reference</button>
      <button class="optBtn" onclick="${act(()=>{UI.closeSheet();UI.choice("Concede the match?",["Yes, concede","No"],{}).then(i=>{ if(i===0){ G.over=true; UI.home(); } });})}">🏳 Concede</button>`);
  },
  gameOver(winner,sa,sb){
    const won=winner===me();
    const tie=!winner;
    beep(won?880:220,.2);
    this._sheet(`<h3 style="text-align:center;font-size:24px">${tie?"🤝 Dead Even":won?"🏆 VICTORY!":"💀 Defeated"}</h3>
      <div class="body" style="text-align:center">
        <p style="font-size:15px">You: <b style="color:var(--green)">${sa} GP</b> &nbsp;·&nbsp; ${G.players[1].name}: <b style="color:var(--red)">${sb} GP</b></p>
        ${tie?'<p class="sub">Tied on GP and Epic GP. The rulebook\'s official tiebreaker: whoever first says "give me my money, bitch."</p>':""}
        <p class="sub">${G.online?"Online demo match":"vs AI"} · ${G.turnN} turns</p>
      </div>
      <div class="sheetBtns">
        <button class="btn primary" onclick="${act(()=>{UI.closeSheet();UI.startGame(G.advanced,G.online);})}">Rematch</button>
        <button class="btn" onclick="${act(()=>{UI.closeSheet();UI.home();})}">Home</button>
      </div>`);
  },

  /* ================= COLLECTION ================= */
  collection(filter){
    filter=filter||"ALL";
    const types=["ALL","DC","PSY","UG","ITEM","FIEND","EPIC","FLAVOR","JUG","START"];
    const list=DB.filter(d=>filter==="ALL"||d.t===filter);
    document.getElementById("colScr").innerHTML=`
      <div class="topbar"><button class="back" onclick="${act(()=>UI.home())}">‹</button><h2>Card Collection</h2><span class="tag">${DB.length} unique</span></div>
      <div class="filters">${types.map(t=>`<button class="fbtn ${t===filter?"on":""}" onclick="${act(()=>UI.collection(t))}">${t==="ALL"?"All":TYPE_META[t].glyph+" "+TYPE_META[t].label}</button>`).join("")}</div>
      <div class="scroll"><div class="notice">✓ = official card text · ◐ = partially confirmed · ⚠ = reconstructed placeholder effect awaiting your licensed card data. Drop licensed art into <b>assets/cards/&lt;id&gt;.jpg</b> and it appears automatically.</div>
      <div class="colGrid">${list.map(d=>cardHTML({d},"",{onTap:act(()=>UI.bigCard({d}))})).join("")}</div></div>`;
    this.scr("colScr");
  },

  /* ================= LOBBY / PAYWALL ================= */
  lobby(){
    if(!S.data.premium){ this.paywall(); return; }
    document.getElementById("lobbyScr").innerHTML=`
      <div class="topbar"><button class="back" onclick="${act(()=>UI.home())}">‹</button><h2>🌐 Online Multiplayer</h2><span class="tag gold">★</span></div>
      <div class="scroll">
        <div class="heroCard"><b>Welcome to the Echoside, ninja.</b><br><span style="color:var(--dim);font-size:13px">Matchmaking, ranked ladders and friend battles. This preview build runs matches against a server-simulated opponent — live PvP activates when the game server ships.</span></div>
        <button class="btn primary" onclick="${act(()=>UI.quickMatch())}">⚡ Quick Match</button>
        <button class="btn" onclick="${act(()=>UI.createRoom())}">➕ Create Private Room</button>
        <button class="btn" onclick="${act(()=>UI.joinRoom())}">🔑 Join with Code</button>
        <div class="statGrid"><div class="statBox"><b>${S.data.stats.online}</b><span>online matches</span></div><div class="statBox"><b>—</b><span>rank (preseason)</span></div></div>
      </div>`;
    this.scr("lobbyScr");
  },
  quickMatch(){
    this._sheet(`<h3>⚡ Quick Match</h3><div class="spinner"></div><div class="sub" style="text-align:center" id="mmTxt">Searching the Nethervoid for opponents…</div>`);
    setTimeout(()=>{ const t=document.getElementById("mmTxt"); if(t) t.textContent="Opponent found: Wicked_Jester_66 (simulated)"; beep(660,.08); },1600);
    setTimeout(()=>{ this.closeSheet(); this.newGameSheet(true); },2600);
  },
  createRoom(){
    const code=Array.from({length:5},()=>"ABCDEFGHJKMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*31)]).join("");
    this._sheet(`<h3>Private Room</h3><div class="codeBox">${code}</div>
      <div class="sub" style="text-align:center">Share this code with your homie. Waiting for them to join…</div><div class="spinner"></div>
      <div class="notice">Demo build: the matchmaking server isn't deployed yet, so nobody can actually join. The full flow is wired and ready for the backend.</div>
      <div class="sheetBtns"><button class="btn" onclick="UI.closeSheet()">Cancel</button></div>`);
  },
  joinRoom(){
    this._sheet(`<h3>Join Room</h3><input class="txt" id="joinCode" maxlength="5" placeholder="CODE" autocapitalize="characters">
      <div class="sheetBtns"><button class="btn primary" onclick="${act(()=>{
        UI._sheet('<h3>Join Room</h3><div class=spinner></div><div class=sub style=text-align:center>Connecting…</div>');
        setTimeout(()=>{ UI._sheet('<h3>Join Room</h3><div class=notice>Could not reach the matchmaking server — this preview build has no live backend. Try Quick Match for a simulated opponent.</div><div class=sheetBtns><button class=btn onclick=UI.closeSheet()>OK</button></div>'); },1500);
      })}">Join</button><button class="btn" onclick="UI.closeSheet()">Cancel</button></div>`);
  },
  paywall(sel){
    sel=sel||"life";
    document.getElementById("payScr").innerHTML=`
      <div class="topbar"><button class="back" onclick="${act(()=>UI.home())}">‹</button><h2>Echoside Premium</h2></div>
      <div class="scroll" style="max-width:480px;margin:0 auto;width:100%">

        <span style="color:var(--dim);font-size:13px">Free players get unlimited matches vs AI. Premium unlocks the Echoside network:</span></div>

        <div class="feature"><span class="ic">🏆</span><span><b>Ranked Ladder</b> — seasonal ranks from Fresh Meat to Dark Carnival Legend</span></div>
        <div class="feature"><span class="ic">🎭</span><span><b>Exclusive avatars & card backs</b></span></div>

          <div class="price ${sel==="life"?"sel":""}" onclick="${act(()=>UI.paywall("life"))}"><div class="amt">$39.99</div><div class="per">lifetime · best value</div></div>

  /* ================= RULES ================= */
  rules(){
    document.getElementById("rulesScr").innerHTML=`
      <div class="topbar"><button class="back" onclick="${act(()=>G&&!G.over?UI.scr("gameScr"):UI.home())}">‹</button><h2>How to Play</h2></div>
      <div class="scroll" style="font-size:13px;line-height:1.6">
      <button class="btn green" onclick="${act(()=>TUT.start())}">🎓 Prefer learning by doing? Play the 5-minute Tutorial</button>
      <h3>The Goal</h3><p>Build the deck with the most <b style="color:var(--green)">Gathering Points (GP)</b>. The game ends when the last Epic is drawn or the Main Deck runs out — then every card you own is counted. Cheap cards score 1 GP, mid-cost 2–3, Epics the most.</p>
      <h3>Your Turn</h3><p>Play cards from your hand one at a time — most generate <b style="color:var(--gold)">☯ Karma</b>, the only currency. Spend Karma any time on Gallery cards, one Epic per turn, or the top Juggalo card (always 3 ☯; pay 1 ☯ to cycle it). Purchases go to your <b>discard pile</b> and shuffle into your deck later. At end of turn everything played and held is discarded, leftover Karma burns, and you draw 5 fresh cards.</p>
      <h3>Crews & Unity</h3><p>Get <b>3+ cards of one crew in play</b> to claim that crew's Unity Benefit (once per turn): <span style="color:var(--dc)">Dark Carnival +2 ☯</span>, <span style="color:var(--psy)">Psychopathic draw a card</span>, <span style="color:var(--ug)">Underground draw a Flavor card</span>.</p>
      <h3>Card Types</h3>
      <table class="rt">
      <tr><th>Type</th><th>Behavior</th></tr>
      <tr><td>🎪💀🎤 Crew</td><td>Karma, draws, abolish effects. Count toward Unity.</td></tr>
      <tr><td>🧰 Item</td><td>Permanent. Use once per turn; readies at your turn start. Can't be stomped.</td></tr>
      <tr><td>👹 Fiend</td><td>Enters play the moment you buy it. One-time effect — many stomp opponents' cards — then it's abolished to the Abyss.</td></tr>
      <tr><td>🌟 Epic</td><td>Expensive, huge GP. One purchase per turn. Last Epic drawn = game end.</td></tr>
      <tr><td>🃏 Flavor</td><td>Never bought, never joins your deck — drawn by effects, played once, then shared Flavor discard.</td></tr>
      <tr><td>🤡 Juggalo</td><td>Always on sale for 3 ☯, gives +2 ☯, belongs to a crew.</td></tr></table>
      <h3>Stomps, Abolish & the Wheel</h3>
      <p><b>🥾 Stomp</b>: counter an opponent's card <i>as it's played</i> — it never resolves. 🛡 shielded cards can't be stomped; <b>K.G. Kevin Gill</b> protects your whole turn (but not from Fiend attacks). <b>🕳 Abolish</b>: exile cards to the Abyss — thin your starter Ninjas out of your deck! <b>🎡 Wheel of Fate</b>: some cards roll the d12 on a 12-result table of fortunes.</p>
      <h3>Strategy tips (from the designers)</h3><p>Commit to one or two crews. Early game: buy Karma generators and abolish your starters. Juggalos are strong early buys. Watch your opponent's Fiends before playing your bombs — or lead with Kevin Gill.</p>
      <div class="notice">This digital edition reconstructs the official 2016 rules from Psychopathic Records' how-to-play video. Cards marked ⚠ and Wheel results 2, 4, 5, 6, 9, 12 use placeholder effects until checked against licensed materials. The Oracle of the Three Rings expansion (Tarot & Gambit cards, Fast/Mirror effects) ships in a future update.</div>
      </div>`;
    this.scr("rulesScr");
  },

  /* ================= PROFILE & SETTINGS ================= */
  profile(){
    const st=S.data.stats;
    document.getElementById("profScr").innerHTML=`
      <div class="topbar"><button class="back" onclick="${act(()=>UI.home())}">‹</button><h2>Profile</h2>${S.data.premium?'<span class="tag gold">★ PREMIUM</span>':""}</div>
      <div class="scroll">
        <div class="statGrid">
          <div class="statBox"><b>${st.games}</b><span>matches</span></div>
          <div class="statBox"><b>${st.wins}</b><span>wins</span></div>
          <div class="statBox"><b>${st.abolished}</b><span>cards abolished</span></div>
          <div class="statBox"><b>${st.stomps}</b><span>stomps</span></div>
        </div>
        <h3>Achievements</h3>
        ${ACHS.map(a=>`<div class="ach ${S.data.ach[a.id]?"":"locked"}"><span class="ic">${a.ic}</span><span class="t"><b>${a.n}</b><span>${a.d}</span></span></div>`).join("")}
      </div>`;
    this.scr("profScr");
  },
  settings(){
    const st=S.data.set;
    const tog=(key,label)=>`<button class="optBtn" onclick="${act(()=>{S.data.set[key]=!S.data.set[key];S.save();UI.settings();})}">${st[key]?"🟢":"⚪"} ${label}</button>`;
    document.getElementById("setScr").innerHTML=`
      <div class="topbar"><button class="back" onclick="${act(()=>UI.home())}">‹</button><h2>Settings</h2></div>
      <div class="scroll">
        ${tog("stompAsk","Ask before letting opponent cards resolve (stomp prompts)")}
        ${tog("sound","Sound effects")}
        ${tog("haptics","Haptic feedback")}
        <button class="optBtn" onclick="${act(()=>{S.data.set.speed=st.speed>=2?0.7:st.speed+0.65;S.save();UI.settings();})}">🏃 Game speed: ${st.speed<1?"Relaxed":st.speed<1.5?"Normal":"Fast"}</button>
        <h3 style="margin-top:20px">Danger zone</h3>
        <button class="optBtn" style="color:var(--red)" onclick="${act(()=>{UI.choice("Reset all stats, achievements and premium status?",["Reset everything","Cancel"],{}).then(i=>{ if(i===0){ localStorage.removeItem("echoside"); S.load(); UI.toast("Progress reset."); UI.settings(); } });})}">🗑 Reset all progress</button>
      </div>`;
    this.scr("setScr");
  }
};

/* ---- tiny synth ---- */
let AC=null;
function beep(freq,dur){
  if(!S.data.set.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type="triangle"; o.frequency.value=freq;
    g.gain.setValueAtTime(.12,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}

document.getElementById("modal").addEventListener("click",e=>{ /* sheet choices must be answered — no dismiss-by-tap to avoid stuck promises */ });
UI.home();
</script>
